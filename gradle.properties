# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# KSP registers its generated sources through the `kotlin.sourceSets` DSL, which AGP 9's built-in
# Kotlin support rejects by default. This is AGP's own documented escape hatch for exactly that
# clash. Needed by the AppFunctions compiler, which is a KSP processor.
# https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# --- Inference engine toggles -------------------------------------------------
# llama.cpp is compiled from source with the NDK (there is no official Maven AAR).
# The first build clones llama.cpp and takes several minutes; every build after
# that is incremental. Set to false to drop the :engine-llamacpp native build
# entirely -- the app still compiles and simply reports llama.cpp as unavailable.
enableLlamaCpp=true

# ABIs to build llama.cpp for. arm64-v8a covers every phone that can realistically
# run an LLM; adding x86_64 lets it run on an emulator but roughly doubles build time.
llamaCppAbiFilters=arm64-v8a

# MNN is likewise compiled from source with the NDK (Alibaba publishes no Maven AAR
# for its LLM runtime). Same deal as llama.cpp: the first build is slow, set to false
# to drop the :engine-mnn native build and have the app report MNN as unavailable.
enableMnn=true
mnnAbiFilters=arm64-v8a

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
