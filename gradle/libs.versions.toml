[versions]
agp = "9.3.1"
hilt = "2.60.1"
hiltWork = "1.3.0"
# 1.19.0 requires compileSdk 37, which has not shipped in the SDK yet. 1.17.0 is the newest that
# builds against 36.x. Bump both together once android-37 is installable.
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Like coreKtx, 2.11.0 requires compileSdk 37, which has not shipped yet.
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# MUST be >= 1.11.0, and do not "fix" this downwards.
#
# LiteRT-LM 0.14.0's POM declares kotlinx-coroutines 1.9.0, but its *bytecode* was compiled against
# 1.11.0, and the two are not binary compatible. Kotlin 2.2 changed the jvm-default layout: in
# 1.11.0 the synthetic `SendChannel.close$default` is a static method on the interface itself, while
# in <= 1.10.2 it lives only in `SendChannel$DefaultImpls`. LiteRT-LM's `Conversation.sendMessageAsync`
# calls the interface-static form, so on any older coroutines it dies at the end of the very first
# response with:
#
#   NoSuchMethodError: No static method close$default(...) in class SendChannel
#     at com.google.ai.edge.litertlm.Conversation$sendMessageAsync$1$1.onDone
#
# Gradle picks the highest requested version, so simply declaring 1.11.0 here is enough to win over
# the POM's stale 1.9.0.
coroutines = "1.11.0"
serialization = "1.9.0"
okhttp = "4.12.0"
# Paging 3.3.x builds against compileSdk 36; 3.4.x wants 37, which has not shipped (see agp note).
paging = "3.3.6"
# On-device PDF text extraction for attached files (Apache PDFBox, Android port).
pdfbox = "2.0.27.0"
navigationCompose = "2.9.6"
# KSP must match the Kotlin version exactly or it refuses to load.
ksp = "2.3.2"
# alpha09 requires compileSdk 37, which does not exist in any SDK channel yet (36.1 is the ceiling).
# alpha08 needs only compileSdk 36. Bump once android-37 ships.
appfunctions = "1.0.0-alpha08"
room = "2.8.4"
# Persistent, resumable model downloads that survive the app being backgrounded or killed.
work = "2.10.1"
# App Startup: used to warm the default model into memory at launch. Already on the classpath
# transitively via WorkManager; declared explicitly so the dependency is not implicit.
startup = "1.2.0"
# Renders the model's Markdown output -- links, tables, code, lists -- as native Compose.
# Pinned to 0.35.0: newer releases are built with Kotlin 2.4 (stdlib metadata 2.4.0) which this
# project's Kotlin 2.2 compiler cannot read. 0.35.0 requires only stdlib 2.1.21.
markdownRenderer = "0.35.0"
# Speech-to-text. Resolved from GitHub releases via the ivy repo in settings.gradle.kts.
sherpaOnnx = "1.13.6"
# bzip2 + tar, for one job: sherpa-onnx publishes its keyword-spotting models only as .tar.bz2 on
# GitHub releases, with no per-file mirror, and the Android runtime has neither codec.
commonsCompress = "1.27.1"
# LiteRT-LM is the successor to the (now deprecated) MediaPipe LLM Inference API.
# Published on Google Maven only -- it is NOT on Maven Central.
litertlm = "0.14.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# The real org.json, for unit tests only: the mockable android.jar ships it as throwing stubs.
json = { group = "org.json", name = "json", version = "20240303" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Versionless: the Compose BOM governs these the same way it governs material3, so the two can never
# drift into an incompatible pair.
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
androidx-appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-service = { group = "androidx.appfunctions", name = "appfunctions-service", version.ref = "appfunctions" }
androidx-appfunctions-compiler = { group = "androidx.appfunctions", name = "appfunctions-compiler", version.ref = "appfunctions" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-android", version.ref = "markdownRenderer" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3-android", version.ref = "markdownRenderer" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
